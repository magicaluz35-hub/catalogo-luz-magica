<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo Luz Mágica</title>
<meta name="description" content="Catálogo de tocadores y espejos Luz Mágica, Aranjuez, Medellín.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Diseño: fondo blanco, cabecera con menú, portada tranquila con categorías en tarjetas, rejilla de productos. Colores de marca (rosa y ciruela) del catálogo en PDF. */
:root{
  --bg:#ffffff;
  --bg-suave:#fbf6f9;
  --rosa-tinte:#fdecf5;
  --card:#ffffff;
  --line:#eadfe6;
  --line-2:#d8c8d3;
  --foto:#f4eff3;
  --ink:#2e2833;
  --ink-2:#675d70;
  --rosa:#e32d91;
  --rosa-btn:#c91f80;
  --magenta:#b4186e;
  --ciruela:#413d4b;
  --aviso:#fff4d6;
  --font:'Poppins','Century Gothic','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{height:44px;width:auto;flex:none;border-radius:8px}
.brand b{display:block;font-size:17px;line-height:1.1;color:var(--magenta);white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}
.burger{margin-left:auto;align-self:flex-start;width:44px;height:58px;border:0;background:var(--rosa);border-radius:0 0 4px 4px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 8px rgba(65,61,75,.25)}
.nav{display:none;flex:1 0 100%;order:3;flex-direction:column;gap:2px;padding:8px 0 14px}
.nav.open{display:flex}
.nl{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 12px;border-radius:10px;border:0;background:none;text-decoration:none;font-weight:500;cursor:pointer;text-align:left}
.nl:hover{background:var(--rosa-tinte)}
.nl.on{color:var(--magenta);background:var(--rosa-tinte)}
.nl.wa{background:var(--rosa-btn);color:#fff;font-weight:600;justify-content:center}
.nl.wa:hover{background:var(--magenta)}
.dd{position:relative}
.dd-panel{display:none;padding:4px 0 8px 12px}
.dd.open .dd-panel{display:grid;grid-template-columns:1fr;gap:2px}
.dd-panel a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:14px}
.dd-panel a:hover{background:var(--rosa-tinte)}
.dd-panel a.on{color:var(--magenta);font-weight:600}
.dd-panel a span{color:var(--ink-2);font-size:12px}
.caret{transition:transform .15s}
.dd.open .caret{transform:rotate(180deg)}
@media(min-width:880px){
  .burger{display:none}
  .nav{display:flex;flex:0 1 auto;order:0;flex-direction:row;align-items:center;margin-left:auto;padding:0;gap:4px}
  .dd-panel{position:absolute;top:calc(100% + 8px);right:0;width:420px;max-height:70vh;overflow:auto;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 38px rgba(65,61,75,.18)}
  .dd.open .dd-panel{grid-template-columns:1fr 1fr}
}

/* Portada */
.hero{display:grid;gap:24px;align-items:center;margin-top:24px;padding:32px 24px;border-radius:22px;background:var(--rosa-tinte);position:relative;overflow:hidden}
.hero .kicker{color:var(--magenta)}
.hero h1{margin-top:8px;font-size:clamp(34px,6.5vw,56px);line-height:1.05;font-weight:700;color:var(--rosa);text-wrap:balance}
.hero h1 span{display:block;color:var(--ciruela)}
.hero p.t{margin-top:14px;max-width:48ch;color:var(--ink-2)}
.hero .acc{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero .logo{display:none;width:100%;max-width:300px;justify-self:center;border-radius:18px;box-shadow:0 12px 30px rgba(65,61,75,.18)}
@media(min-width:760px){.hero{grid-template-columns:1.3fr .7fr;padding:44px 40px}.hero .logo{display:block}}
.sec{padding-top:44px}
.sec>h2{font-size:clamp(20px,3.4vw,26px);font-weight:700;color:var(--ciruela);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.cats{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
@media(min-width:760px){.cats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.cat{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:box-shadow .15s,transform .15s}
.cat:hover{box-shadow:0 10px 26px rgba(65,61,75,.14);transform:translateY(-2px)}
.cat .ci{position:relative;aspect-ratio:4/3;background:var(--foto);overflow:hidden}
.cat .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.cat .ct{padding:12px 14px 14px}
.cat b{display:block;font-size:14.5px;line-height:1.3}
.cat small{color:var(--ink-2);font-size:12.5px}
.visita{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.vista{padding-top:28px;padding-bottom:40px}
.vista h1{font-size:clamp(26px,5vw,38px);line-height:1.15;font-weight:700;color:var(--ciruela);text-wrap:balance}
.vista .lead{margin-top:8px;color:var(--ink-2);max-width:62ch}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.volver{display:inline-block;margin-top:8px;color:var(--magenta);font-size:14px;font-weight:500}

/* Herramientas */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.tools .f{flex:1 1 240px;min-width:0}
.inp{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--ink)}
.inp::placeholder{color:#8d8396}
.cuenta{color:var(--ink-2);font-size:13px;margin:0 0 14px}

/* Productos */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(65,61,75,.05)}
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:var(--foto);cursor:zoom-in;aspect-ratio:4/5}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph .n{position:absolute;right:8px;bottom:8px;padding:3px 10px;border-radius:99px;background:rgba(46,40,51,.82);color:#fff;font-size:12px}
.sinfoto{display:grid;place-items:center;height:100%;color:var(--ink-2);font-size:13px}
.cb{display:flex;flex-direction:column;gap:10px;flex:1;padding:16px}
.cb h3{font-size:15px;line-height:1.3;font-weight:600;text-wrap:balance}
.tx{display:grid;gap:3px;color:var(--ink-2);font-size:13px;line-height:1.45}
.pr{display:grid;gap:2px;margin-top:auto;padding-top:4px}
.pr p{font-weight:700;color:var(--magenta);font-size:14px;line-height:1.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:12px;border:1px solid transparent;background:var(--rosa-btn);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--magenta)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--rosa-tinte)}
.btn.suave{background:#fff;color:var(--magenta);border-color:var(--magenta)}
.btn.suave:hover{background:var(--rosa-tinte)}
.btn.peligro{background:#9b2146}
.btn.peligro:hover{background:#7d1a38}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.vacio{padding:40px 16px;text-align:center;color:var(--ink-2);background:var(--bg-suave);border-radius:14px}
.editar-rapido{position:absolute;top:10px;left:10px;z-index:2;box-shadow:0 2px 8px rgba(65,61,75,.2)}
.chip-edit{margin-left:auto;font-size:13px;font-weight:600}

/* Información y vendedores */
.cols{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.caja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.caja h2{font-size:16px;font-weight:700;color:var(--magenta);margin-bottom:10px}
.caja li{padding:5px 0}
.caja li+li{border-top:1px solid var(--line)}
.act{margin-top:20px;font-size:13px;color:var(--ink-2)}
.vend{display:grid;gap:10px;margin-top:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.vend li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.vend .vn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.vend .vd{flex:1;min-width:0}
.vend .vd small{display:block;color:var(--ink-2);font-size:12px;overflow-wrap:anywhere}
.vend .vd b{display:block;font-size:19px;letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.interes{margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--rosa-tinte);border:1px solid var(--rosa)}
.interes p{margin-bottom:10px}

/* Pie */
.pie{margin-top:48px;border-top:1px solid var(--line);padding-top:22px;padding-bottom:40px;color:var(--ink-2);font-size:13px}

/* Visor de fotos */
.lb{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:rgba(255,255,255,.98);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lb-top h2{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3}
.lb-main{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--foto)}
.lb-main img{max-width:100%;max-height:100%;object-fit:contain}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(65,61,75,.25);font-size:24px;cursor:pointer}
.lb-nav.p{left:8px}.lb-nav.s{right:8px}
.lb-bot{padding:10px 16px 16px;text-align:center;color:var(--ink-2);font-size:13px}
.lb-bot .pr{justify-items:center}
.miniaturas{display:flex;gap:8px;justify-content:center;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.miniaturas button{flex:none;width:52px;height:52px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--foto);cursor:pointer}
.miniaturas button.on{border-color:var(--rosa)}
.miniaturas img{width:100%;height:100%;object-fit:cover}

/* Edición */
.flota{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:70;width:min(620px,calc(100% - 24px));display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--rosa);box-shadow:0 14px 36px rgba(65,61,75,.28)}
.flota .est{flex:1 1 200px;min-width:0;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.tabs button{min-height:40px;padding:8px 16px;border-radius:99px;border:1px solid var(--line-2);background:#fff;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--rosa-btn);border-color:var(--rosa-btn);color:#fff;font-weight:600}
.filas{display:grid;gap:8px}
.fila-adm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.fila-adm .mini{flex:none;width:48px;height:48px;border-radius:8px;background:var(--foto);object-fit:cover}
.fila-adm .nom{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.fila-adm .nom small{display:block;color:var(--ink-2);font-size:12px}
.fila-adm .bt{display:flex;flex-wrap:wrap;gap:6px}
.fila-adm.oculto{opacity:.6}
.campo{display:grid;gap:6px;margin-bottom:14px}
.campo label,.campo .l{font-weight:600;font-size:14px}
.campo small{display:block;color:var(--ink-2);font-weight:400;font-size:12px}
.grupo{margin-top:26px}
.grupo>h2{font-size:18px;font-weight:700;color:var(--ciruela);margin-bottom:12px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(46,40,51,.55);padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .caja{width:100%;max-width:640px;margin:auto;padding:20px;box-shadow:0 20px 50px rgba(46,40,51,.35)}
.modal h2{font-size:20px;margin-bottom:16px;color:var(--ciruela)}
.fotos-adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.fotos-adm figure{margin:0;display:grid;gap:6px;padding:6px;border-radius:10px;background:var(--foto)}
.fotos-adm img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.fotos-adm .b{display:flex;gap:4px;flex-wrap:wrap}
.fotos-adm .b button{flex:1;min-height:32px;border:1px solid var(--line-2);border-radius:6px;background:#fff;font-size:12px;cursor:pointer}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.aviso{padding:10px 12px;border-radius:10px;background:var(--aviso);font-size:13px;margin:10px 0}
.logo-adm{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo-adm img{height:64px;width:auto;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:max(90px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;max-width:calc(100% - 32px);padding:10px 18px;border-radius:99px;background:var(--ciruela);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
img.roto{visibility:hidden}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.caret,.cat{transition:none}}

html,body{margin:0}
</style></head><body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* Todo el contenido (negocio, textos, categorías, productos, información y vendedores) está en el
   bloque <script id="datos"> y se edita desde "Editar catálogo", sin tocar el diseño. */
var DEFAULTS={
  menuInicio:'Inicio',menuCategorias:'Categorías',menuInfo:'Información',menuWhats:'WhatsApp',
  heroSub:'Catálogo',heroTexto:'Tocadores, espejos, nocheros, zapateros y más. Elige una categoría o mira todos los productos.',
  btnCatalogo:'Ver todos los productos',btnPedir:'Pedir por WhatsApp',
  tituloCategorias:'Explora por categoría',tituloVisitanos:'Visítanos',verInfo:'Ver toda la información',
  tituloDireccion:'Único punto físico',tituloHorario:'Horario de atención',
  catalogoTitulo:'Todos los productos',buscar:'Buscar por nombre, por ejemplo: carvalo',
  infoTitulo:'Información',infoIntro:'Datos generales del negocio, horarios, entregas y condiciones de compra.',
  vendTitulo:'WhatsApp: vendedores autorizados',vendIntro:'Estos son los únicos números autorizados para ventas. Copia el número de cualquier vendedor y escríbele por WhatsApp.'
};
var TEXTOS=[
  ['Menú y botones',[['menuInicio','Menú: Inicio'],['menuCategorias','Menú: Categorías'],['menuInfo','Menú: Información'],['menuWhats','Menú: WhatsApp'],['btnPedir','Botón de cada producto'],['btnCatalogo','Botón de la portada']]],
  ['Portada',[['heroSub','Palabra bajo el nombre (ej. Catálogo)'],['heroTexto','Texto de la portada','l'],['tituloCategorias','Título de las categorías'],['tituloVisitanos','Título del bloque de visita'],['verInfo','Enlace a la información']]],
  ['Página de productos',[['catalogoTitulo','Título de todos los productos'],['buscar','Texto del buscador']]],
  ['Página de información',[['infoTitulo','Título'],['infoIntro','Texto de introducción','l'],['tituloDireccion','Título de la dirección'],['tituloHorario','Título del horario']]],
  ['Página de WhatsApp',[['vendTitulo','Título'],['vendIntro','Texto de introducción','l']]]
];
var ORIGINAL='{}';
var S={};
var dirty=false,canEdit=false,artifactNS=null,assetsNS=null,guardando=false;
var ui={q:'',orden:'',menu:false,dd:false,interes:null,lb:null,tab:'productos',fcat:'',fq:'',ed:null,msg:'',confirmarBorrar:false};

function asegurar(){
  S.productos=(S.productos||[]).filter(function(p){return p&&p.nombre;});
  S.productos.forEach(function(p,i){p.id='p'+i;p.imagenes=(p.imagenes||[]).filter(Boolean);p.texto=p.texto||[];p.precios=p.precios||[];});
  S.negocio=S.negocio||{};S.textos=S.textos||{};
  if(!Array.isArray(S.negocio.direccion))S.negocio.direccion=[];
  if(!Array.isArray(S.negocio.horario))S.negocio.horario=[];
  S.info=S.info||[];S.vendedores=S.vendedores||[];S.categorias=S.categorias||[];S.productos=S.productos||[];
}
function T(k){var v=S.textos&&S.textos[k];return (v!==undefined&&v!=='')?v:DEFAULTS[k];}
function logo(){return S.negocio.logo||'img/logo.webp';}
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function fmtNum(n){n=String(n||'').replace(/\D/g,'');return n.length===10?n.slice(0,3)+' '+n.slice(3,6)+' '+n.slice(6):n;}
function lineas(v){return String(v).split('\n').map(function(s){return s.trim();}).filter(Boolean);}
function precioNum(p){var m=(p.precios&&p.precios[0]||'').match(/(\d{1,3}(?:\.\d{3})+)/);return m?parseInt(m[1].replace(/\./g,''),10):null;}
function visibles(){return S.productos.filter(function(p){return !p.oculto;});}
function conteo(cat){return visibles().filter(function(p){return p.categoria===cat;}).length;}
function ruta(){
  var h=(location.hash||'').replace(/^#/,'');
  if(h==='informacion')return {v:'info'};
  if(h==='vendedores')return {v:'vend'};
  if(h==='catalogo')return {v:'lista',cat:''};
  if(h.indexOf('c-')===0){for(var i=0;i<S.categorias.length;i++){if('c-'+slug(S.categorias[i])===h)return {v:'lista',cat:S.categorias[i]};}}
  return {v:'home'};
}
function img(src,alt,cls){return '<img'+(cls?' class="'+cls+'"':'')+' src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" decoding="async">';}
function editLink(tab,texto){return canEdit?'<button class="btn sm suave chip-edit" data-act="irtab" data-t="'+tab+'">'+(texto||'Editar esta sección')+'</button>':'';}

/* ====== Cabecera y menús ====== */
function cabecera(r){
  var cats=S.categorias.map(function(c){
    return '<a href="#c-'+esc(slug(c))+'" class="'+(r.v==='lista'&&r.cat===c?'on':'')+'">'+esc(c)+'<span>'+conteo(c)+'</span></a>';
  }).join('');
  return '<header class="top"><div class="wrap"><div class="bar">'+

/* ====== Productos ====== */
function tarjeta(p){
  var fotos=p.imagenes||[];
  var portada=fotos[0];
  var ph=portada?img(portada,p.nombre):'<span class="sinfoto">Sin foto</span>';
  return '<article class="card">'+(canEdit?'<button class="btn sm ghost editar-rapido" data-act="editarprodid" data-id="'+esc(p.id)+'">Editar</button>':'')+
    '<button class="ph" data-act="foto" data-id="'+esc(p.id)+'" aria-label="Ver fotos de '+esc(p.nombre)+'">'+ph+(fotos.length>1?'<span class="n">'+fotos.length+' fotos</span>':'')+'</button>'+
    '<div class="cb"><h3>'+esc(p.nombre)+'</h3>'+
    ((p.texto&&p.texto.length)?'<ul class="tx">'+p.texto.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>':'')+
    '<div class="pr">'+(p.precios||[]).map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</div>'+
    '<button class="btn" data-act="wa" data-id="'+esc(p.id)+'">'+esc(T('btnPedir'))+'</button></div></article>';
}
function listaFiltrada(cat){
  var q=norm(ui.q).trim();
  var l=visibles().filter(function(p){
    if(cat&&p.categoria!==cat)return false;
    if(!q)return true;
    return norm(p.nombre+' '+(p.texto||[]).join(' ')+' '+(p.precios||[]).join(' ')).indexOf(q)>=0;
  });
  if(ui.orden){
    l=l.slice().sort(function(a,b){
      var x=precioNum(a),y=precioNum(b);
      if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
      return ui.orden==='asc'?x-y:y-x;
    });
  }
  return l;
}
function pintarGrid(cat){
  var l=listaFiltrada(cat),g=$('#grid'),c=$('#cuenta');
  if(!g)return;
  g.innerHTML=l.length?l.map(tarjeta).join(''):'<div class="vacio" style="grid-column:1/-1">No encontramos productos con esa búsqueda.</div>';
  if(c)c.textContent=l.length+(l.length===1?' producto':' productos');
}

  var f=ui.ed.p.imagenes||[];
  if(!f.length)return '<p class="aviso">Este producto aún no tiene fotos.</p>';
  return '<div class="fotos-adm">'+f.map(function(s,k){return '<figure><img src="'+esc(s)+'" alt="Foto '+(k+1)+'"><div class="b">'+(k>0?'<button data-act="principal" data-k="'+k+'">Principal</button>':'<button disabled>Principal</button>')+'<button data-act="quitarfoto" data-k="'+k+'">Quitar</button></div></figure>';}).join('')+'</div>';
}

/* ====== Dibujo general ====== */
function render(){
  var r=ruta();
  var cuerpo=r.v==='info'?vistaInfo():r.v==='vend'?vistaVend():r.v==='admin'?vistaAdmin():r.v==='lista'?vistaLista(r):vistaHome();
  var pie='<footer class="wrap pie"><p><b>'+esc(S.negocio.nombre)+'</b> · '+esc(S.negocio.direccion.join(', '))+'</p></footer>';
  $('#app').innerHTML=cabecera(r)+cuerpo+pie+visor()+modalProd()+'<div id="barra"></div>';
  document.body.style.overflow=(ui.lb||ui.ed)?'hidden':'';
  if(r.v==='lista')pintarGrid(r.cat);
  pintarBarra();
  if(ui.lb){var x=$('#lb-x');if(x)x.focus();}
}
function toast(t){var el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},2600);}
function copiar(t,ok){
  function f(){try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var s=document.execCommand('copy');ta.remove();toast(s?ok:'Mantén presionado el número para copiarlo');}catch(e){toast('Mantén presionado el número para copiarlo');}}
  try{navigator.clipboard.writeText(t).then(function(){toast(ok);},f);}catch(e){f();}
}
function mover(a,i,d){var j=i+d;if(j<0||j>=a.length)return false;var t=a[i];a[i]=a[j];a[j]=t;return true;}

/* ====== Guardado ====== */
function datosTag(){return '<script type="application/json" id="datos" data-keep>'+JSON.stringify(S).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')+'<\/script>';}
function construirDoc(){
  var partes=[].slice.call(document.querySelectorAll('[data-keep]')).map(function(el){
    if(el.id==='app')return '<div id="app" data-keep></div>';
    if(el.id==='datos')return datosTag();
    return el.outerHTML;
  });
  return PREFIX+partes.join('')+'</body></html>';
}
function validar(){
  for(var i=0;i<S.vendedores.length;i++){
    var d=String(S.vendedores[i].numero||'').replace(/\D/g,'');
    if(d.length!==10)return 'El vendedor '+(i+1)+' debe tener un número de 10 dígitos.';
    S.vendedores[i].numero=d;
  }
  if(!String(S.negocio.nombre||'').trim())return 'El nombre del negocio no puede quedar vacío.';
  for(var j=0;j<S.productos.length;j++){if(S.categorias.indexOf(S.productos[j].categoria)<0)return 'El producto "'+S.productos[j].nombre+'" no tiene categoría válida.';}
  return '';
}
function guardar(){
  if(guardando)return;
  var err=validar();
  if(err){ui.msg=err;pintarBarra();return;}
  if(!artifactNS){ui.msg='Guardar no está disponible en esta vista.';pintarBarra();return;}
  S.negocio.actualizado=new Date().toISOString().slice(0,10);
  var html=construirDoc();
  if(html.indexOf('id="programa"')<0||html.indexOf('id="estilos"')<0||html.indexOf('function construirDoc')<0||html.indexOf('<!doctype html>')!==0){ui.msg='No se pudo preparar la página para guardar. No se hizo ningún cambio.';pintarBarra();return;}
  guardando=true;ui.msg='';pintarBarra();
  artifactNS.publish(html).then(function(){ /* la página se recarga sola con la versión nueva */ },function(e){
    guardando=false;
    var c=e&&e.code;
    ui.msg=c==='conflict'?'Otra persona guardó antes. La página se va a recargar con su versión.':(c==='not_writer'||c==='not_granted')?'Tu cuenta no tiene permiso para guardar.':'No se pudo guardar. Intenta de nuevo.';
    pintarBarra();
  });
}

/* ====== Fotos nuevas ====== */
function reducir(file,max){
  return new Promise(function(ok,mal){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var m=Math.max(im.width,im.height),k=m>max?max/m:1,c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){if(b&&b.type==='image/webp')return ok(b);c.toBlob(function(j){j?ok(j):mal(new Error('imagen'));},'image/jpeg',.82);},'image/webp',.8);
    };
    im.onerror=function(){URL.revokeObjectURL(u);mal(new Error('imagen'));};
    im.src=u;
  });
}
function subirFotos(files){
  var msg=$('#e-msg');
  function m(t){if(msg){msg.hidden=!t;msg.textContent=t||'';}}
  var lista=[].slice.call(files),n=0;
  (function sig(){
    if(!lista.length){m(n?'Listo: '+n+(n===1?' foto agregada.':' fotos agregadas.'):'');return;}
    var f=lista.shift();m('Subiendo '+(n+1)+'…');
    reducir(f,900).then(function(b){return assetsNS.upload(b,{type:b.type});}).then(function(r){
      ui.ed.p.imagenes.push('/_blob/'+r.id);n++;var c=$('#e-fotos');if(c)c.innerHTML=fotosAdm();sig();
    }).catch(function(){m('No se pudo subir una de las fotos. Revisa que sea una imagen e intenta de nuevo.');});
  })();
}
function subirLogo(file){
  reducir(file,480).then(function(b){return assetsNS.upload(b,{type:b.type});}).then(function(r){
    S.negocio.logo='/_blob/'+r.id;marcar();render();
  }).catch(function(){toast('No se pudo subir el logo. Intenta con otra imagen.');});
}

/* ====== Eventos ====== */
var app=document.getElementById('app');
function productoPorId(id){return S.productos.filter(function(p){return p.id===id;})[0];}
function nuevoId(){var n=1;while(productoPorId('n'+n))n++;return 'n'+n;}
function leerEditor(){
  var p=ui.ed.p;
  p.nombre=$('#e-nombre').value.trim();p.categoria=$('#e-cat').value;
  p.texto=lineas($('#e-texto').value);p.precios=lineas($('#e-precios').value);
  p.oculto=$('#e-oculto').checked;
}
function irTab(t){ui.tab=t;ui.menu=false;if(location.hash==='#admin'){render();window.scrollTo(0,0);}else location.hash='admin';}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b){
    if(ui.dd&&!ev.target.closest('.dd')){ui.dd=false;var d=$('.dd');if(d)d.classList.remove('open');}
    return;
  }
  var a=b.dataset.act,i=parseInt(b.dataset.i,10);
  if(a==='menu'){ui.menu=!ui.menu;render();return;}
  if(a==='dd'){ui.dd=!ui.dd;render();return;}
  if(a==='foto'){ui.lb={id:b.dataset.id,i:0};render();return;}
  if(a==='cerrar'){ui.lb=null;render();return;}
  if(a==='ant'||a==='sig'){var p=productoPorId(ui.lb.id),n=(p.imagenes||[]).length;ui.lb.i=(ui.lb.i+(a==='sig'?1:-1)+n)%n;render();return;}
  if(a==='irfoto'){ui.lb.i=parseInt(b.dataset.k,10);render();return;}
  if(a==='wa'){ui.interes=b.dataset.id;ui.lb=null;if(location.hash==='#vendedores'){render();window.scrollTo(0,0);}else location.hash='vendedores';return;}
  if(a==='copiar'){copiar(b.dataset.n,'Número copiado');return;}
  if(a==='copiarmsg'){copiar(mensajeInteres(productoPorId(b.dataset.id)),'Mensaje copiado');return;}
  if(a==='quitarinteres'){ui.interes=null;render();return;}
  if(!canEdit)return;
  if(a==='irtab'){irTab(b.dataset.t);return;}
  if(a==='tab'){ui.tab=b.dataset.t;render();return;}
  if(a==='guardar'){guardar();return;}
  if(a==='descartar'){S=JSON.parse(ORIGINAL);asegurar();dirty=false;ui.msg='';ui.ed=null;render();return;}
  if(a==='nuevoprod'){ui.confirmarBorrar=false;ui.ed={i:-1,p:{id:nuevoId(),nombre:'',categoria:ui.fcat||S.categorias[0]||'',texto:[],precios:[],imagenes:[],mini:'',oculto:false}};render();return;}
  if(a==='editarprod'){ui.confirmarBorrar=false;ui.ed={i:i,p:JSON.parse(JSON.stringify(S.productos[i]))};render();return;}
  if(a==='editarprodid'){var ix=S.productos.indexOf(productoPorId(b.dataset.id));if(ix>=0){ui.confirmarBorrar=false;ui.ed={i:ix,p:JSON.parse(JSON.stringify(S.productos[ix]))};render();}return;}
  if(a==='cancelarprod'){ui.ed=null;render();return;}
  if(a==='aplicarprod'){
    leerEditor();var p=ui.ed.p;
    if(!p.nombre){var m=$('#e-msg');m.hidden=false;m.textContent='Escribe el nombre del producto.';return;}
    var antes=ui.ed.i>=0?S.productos[ui.ed.i]:null;
    if(!antes||(antes.imagenes||[])[0]!==(p.imagenes||[])[0])p.mini='';
    if(ui.ed.i<0)S.productos.push(p);else S.productos[ui.ed.i]=p;
    ui.ed=null;marcar();render();return;
  }
  if(a==='borrarprod'){
    if(!ui.confirmarBorrar){ui.confirmarBorrar=true;leerEditor();render();return;}
    S.productos.splice(ui.ed.i,1);ui.ed=null;ui.confirmarBorrar=false;marcar();render();return;
  }
  if(a==='principal'){var f=ui.ed.p.imagenes,k=parseInt(b.dataset.k,10),x=f.splice(k,1)[0];f.unshift(x);$('#e-fotos').innerHTML=fotosAdm();return;}
  if(a==='quitarfoto'){ui.ed.p.imagenes.splice(parseInt(b.dataset.k,10),1);$('#e-fotos').innerHTML=fotosAdm();return;}
  if(a==='subirprod'||a==='bajarprod'){
    var d=a==='subirprod'?-1:1,prods=S.productos,j=i+d;
    while(j>=0&&j<prods.length&&(ui.fcat&&prods[j].categoria!==ui.fcat))j+=d;
    if(j>=0&&j<prods.length){var t=prods[i];prods[i]=prods[j];prods[j]=t;marcar();render();}
    return;
  }
  if(a==='logorestaurar'){S.negocio.logo='img/logo.webp';marcar();render();return;}
  if(a==='subircat'||a==='bajarcat'){if(mover(S.categorias,i,a==='subircat'?-1:1)){marcar();render();}return;}
  if(a==='borrarcat'){S.categorias.splice(i,1);marcar();render();return;}
  if(a==='nuevacat'){var nom='Nueva categoría',k2=1;while(S.categorias.indexOf(nom)>=0){k2++;nom='Nueva categoría '+k2;}S.categorias.push(nom);marcar();render();return;}
  if(a==='subirinfo'||a==='bajarinfo'){if(mover(S.info,i,a==='subirinfo'?-1:1)){marcar();render();}return;}
  if(a==='borrarinfo'){S.info.splice(i,1);marcar();render();return;}
  if(a==='nuevainfo'){S.info.push({titulo:'Nueva sección',lineas:[]});marcar();render();return;}
  if(a==='subirvend'||a==='bajarvend'){if(mover(S.vendedores,i,a==='subirvend'?-1:1)){marcar();render();}return;}
  if(a==='borrarvend'){S.vendedores.splice(i,1);marcar();render();return;}
  if(a==='nuevovend'){S.vendedores.push({nombre:'',numero:''});marcar();render();return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){ui.q=t.value;pintarGrid(ruta().cat);return;}
  if(t.id==='orden'){ui.orden=t.value;pintarGrid(ruta().cat);return;}
  if(!canEdit)return;
  if(t.id==='fq'){ui.fq=t.value;var pos=t.selectionStart;render();var n=$('#fq');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
  if(t.dataset.neg){S.negocio[t.dataset.neg]=t.value;marcar();return;}
  if(t.dataset.neglines){S.negocio[t.dataset.neglines]=lineas(t.value);marcar();return;}
  if(t.dataset.txt){S.textos[t.dataset.txt]=t.value;marcar();return;}
  if(t.dataset.info==='t'){S.info[+t.dataset.i].titulo=t.value;marcar();return;}
  if(t.dataset.info==='l'){S.info[+t.dataset.i].lineas=lineas(t.value);marcar();return;}
  if(t.dataset.v==='n'){S.vendedores[+t.dataset.i].nombre=t.value;marcar();return;}
  if(t.dataset.v==='num'){S.vendedores[+t.dataset.i].numero=t.value;marcar();return;}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='orden'){ui.orden=t.value;pintarGrid(ruta().cat);return;}
  if(!canEdit)return;
  if(t.id==='fcat'){ui.fcat=t.value;render();return;}
  if(t.id==='e-file'){if(t.files&&t.files.length&&assetsNS)subirFotos(t.files);t.value='';return;}
  if(t.id==='logo-file'){if(t.files&&t.files[0]&&assetsNS)subirLogo(t.files[0]);t.value='';return;}
  if(t.dataset.cat!==undefined){
    var i=+t.dataset.cat,viejo=S.categorias[i],nuevo=t.value.trim();
    if(!nuevo||(S.categorias.indexOf(nuevo)>=0&&nuevo!==viejo)){ui.msg='Ese nombre está vacío o ya existe.';render();return;}
    S.productos.forEach(function(p){if(p.categoria===viejo)p.categoria=nuevo;});
    S.categorias[i]=nuevo;marcar();render();
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){if(ui.lb){ui.lb=null;render();}else if(ui.ed){ui.ed=null;render();}else if(ui.menu||ui.dd){ui.menu=false;ui.dd=false;render();}return;}
  if(ui.lb&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')){var p=productoPorId(ui.lb.id),n=(p.imagenes||[]).length;if(n>1){ui.lb.i=(ui.lb.i+(ev.key==='ArrowRight'?1:-1)+n)%n;render();}}
});
document.addEventListener('error',function(ev){if(ev.target&&ev.target.tagName==='IMG')ev.target.classList.add('roto');},true);
window.addEventListener('hashchange',function(){ui.menu=false;ui.dd=false;ui.lb=null;render();window.scrollTo(0,0);});


/* Arranque: lee datos.json (lo edita el panel Pages CMS) */
fetch('datos.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
  S=d;asegurar();render();
}).catch(function(){document.getElementById('app').innerHTML='<main class="wrap vista"><h1>No se pudo cargar el catálogo</h1><p class="lead">Recarga la página en unos segundos.</p></main>';});
})();
</script>
