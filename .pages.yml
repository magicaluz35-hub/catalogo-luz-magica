# Configuración del panel de edición (Pages CMS) — Luz Mágica
# Esto define lo que el dueño ve y puede cambiar en pagescms.org.
# Si agregas un campo aquí, aparece en el panel. No borres los campos "sku" ni "codigo".

media:
  input: img
  output: /img
  extensions: [jpg, jpeg, png, webp]

content:
  - name: productos
    label: Productos
    # Una carpeta con un archivo por mueble, no un archivo con los 115.
    # El buscador y el orden del panel solo funcionan así; con todo en un
    # solo archivo tocaba bajar por la lista entera para encontrar uno.
    type: collection
    path: contenido/productos
    format: json
    filename: "{fields.sku}.json"
    view:
      fields: [nombre, sku, categoria, precio, fotos]
      primary: nombre
      search: [nombre, sku, descripcion, categoria]
      sort: [sku, nombre, precio, categoria]
      default:
        sort: sku
        order: asc
    fields:
      - name: nombre
        label: Nombre del producto
        description: "Sale en la tarjeta, en la ficha y en el mensaje de WhatsApp. Si pasa de unas 60 letras, en la tarjeta se corta con puntos suspensivos."
        type: string
        required: true
      - name: sku
        label: Código SKU (NO LO CAMBIES después de publicar)
        description: Este código forma la dirección web del producto. Si lo cambias, los enlaces que ya compartieron los asesores dejan de funcionar.
        type: string
        required: true
        pattern:
          regex: "^[A-Za-z0-9-]+$"
          message: Solo letras, números y guiones. Sin espacios ni tildes.
      - name: precio
        label: Precio en pesos
        description: "Solo el número, sin puntos ni signo de pesos: escribe 1400000, no $1.400.000. El catálogo le pone el formato."
        type: number
        required: true
      - name: categoria
        label: Línea
        description: "Decide en qué línea del catálogo aparece el mueble y qué dirección web tiene su línea. Un mueble solo puede estar en una."
        type: select
        required: true
        options:
          values:
            - { value: tocadores-120, label: Tocadores de 1.20 }
            - { value: tocadores-metro-mini, label: Tocadores de metro y mini }
            - { value: carvalo-solteron, label: Carvalo y Solterón }
            - { value: madera-rh, label: Tocadores en madera RH }
            - { value: hello-kitty, label: Línea Hello Kitty }
            - { value: paris-modular, label: París Modular }
            - { value: nocheros-zapateros, label: "Nocheros, cómodas y zapateros" }
            - { value: espejos, label: Espejos }
            - { value: repisas, label: Repisas }
            - { value: sillas-puffs, label: Sillas y puffs }
      - name: descripcion
        label: Descripción
        description: Qué trae y qué lo hace especial. Si la dejas vacía, sale un texto general.
        type: text
      - name: plazoDesde
        label: Días de entrega — desde
        description: "Déjalo vacío si el mueble sale en el plazo normal del taller. Llénalo solo cuando este tarde distinto: si son de 15 a 20 días, escribe 15 aquí y 20 en el de abajo. Si el plazo es solo un tope (hasta 25 días), deja este vacío."
        type: number
      - name: plazoHasta
        label: Días de entrega — hasta
        description: "El máximo de días hábiles de ESTE mueble. La frase que lee el cliente la arma el catálogo solo, y el número más alto de todos es el que sale en la nota del catálogo y en la portada."
        type: number
      - name: fotos
        label: Fotos
        description: "VERTICALES, tomadas con la cámara en 3:4, que es como viene de fábrica. Esa es la forma exacta del recuadro del catálogo, así que la foto encaja sin recortarse. Si la tomas en 9:16 o cuadrada, el catálogo recorta lo que sobra y ahí se pierde la base del mueble o el borde del espejo. La PRIMERA es la que se ve en el catálogo y en la vista previa de WhatsApp."
        type: image
        list: true
        options:
          extensions: [jpg, jpeg, png, webp]
      - name: iluminacion
        label: Iluminación
        description: "Los ojos de buey son los bombillos redondos alrededor del espejo, al estilo camerino. No son lo mismo que la cinta LED, y el cliente los busca por separado: con esto el mueble sale en el filtro correcto del catálogo."
        type: select
        default: ninguna
        options:
          values:
            - { value: ninguna, label: Sin luz }
            - { value: led, label: Luz LED }
            - { value: ojos, label: Ojos de buey }
            - { value: ambas, label: "Luz LED y ojos de buey" }
      - name: destacado
        label: Mostrar en "Favoritos de la casa"
        description: "OJO: la portada muestra SOLO CUATRO. Si marcas un quinto no aparece y parece que la casilla está dañada. Para rotar, desmarca uno antes de marcar otro."
        type: boolean
      - name: nuevo
        label: Mostrar en "Recién llegados"
        description: "También muestra solo cuatro en la portada: los de código más alto entre los marcados."
        type: boolean

  - name: asesores
    label: Asesores
    type: file
    path: src/_data/asesores.json
    list: true
    view:
      fields: [nombre, codigo, whatsapp, activo]
      primary: nombre
      search: [nombre, codigo, whatsapp]
      sort: [codigo, nombre]
      default:
        sort: codigo
        order: asc
    fields:
      - name: nombre
        label: Nombre del asesor
        description: "Como lo ve el cliente en la barra de arriba y en el directorio público de números autorizados. Nombre y apellido o solo el nombre, como prefiera cada uno."
        type: string
        required: true
      - name: whatsapp
        label: WhatsApp con indicativo, solo números
        description: "Ejemplo: 573001234567. Sin el signo + y sin espacios."
        type: string
        pattern:
          regex: "^[0-9]*$"
          message: Solo números, sin el signo + ni espacios.
        required: true
      - name: codigo
        label: Código (NO LO CAMBIES después de repartir el enlace)
        description: Es el que arma el enlace personal del asesor. Si lo cambias, pierde los clientes que ya tenía asignados.
        type: string
        required: true
      - name: activo
        label: Activo
        description: Desmárcalo cuando alguien salga del equipo. Desaparece de la lista pública y su enlace deja de asignarle clientes.
        type: boolean
      - name: enRotacion
        label: Recibe clientes que llegan sin enlace
        description: "Marcado, entra en el reparto automático: cuando alguien llega al catálogo sin el enlace de nadie, le toca uno de estos. La línea de la galería va desmarcada para que no le caigan clientes del reparto."
        type: boolean
      - name: nota
        label: Nota interna
        description: "Solo la ves tú en este panel. El cliente nunca la ve."
        type: string

  - name: categorias
    label: Líneas del catálogo
    type: file
    path: src/_data/categorias.json
    list: true
    view:
      fields: [foto, nombre, grupo]
      primary: nombre
      search: [nombre, slug, descripcion]
      sort: [grupo, nombre]
      default:
        sort: grupo
        order: asc
    fields:
      - name: nombre
        label: Nombre de la línea
        description: "Como sale en el menú del catálogo y en el título de la página de esa línea."
        type: string
        required: true
      - name: grupo
        label: Grupo
        description: Decide en cuál de los dos bloques del inicio aparece la línea.
        type: select
        required: true
        options:
          values:
            - { value: tocadores, label: Tocadores }
            - { value: acompanar, label: Para acompañar }
      - name: slug
        label: Identificador web (NO LO CAMBIES)
        description: Forma la dirección de la línea y conecta los productos con ella.
        type: string
        required: true
      - name: descripcion
        label: Descripción
        description: "El párrafo que va arriba de las tarjetas en la página de esa línea. Si lo dejas vacío sale un texto general con el número de muebles."
        type: text
      - name: foto
        label: Foto de portada
        description: "La que representa la línea en el inicio. Elige una que se entienda en chiquito: en celular se ve del tamaño de una tarjeta."
        type: image

  - name: negocio
    label: Datos del negocio
    type: file
    path: src/_data/negocio.json
    fields:
      # ---- Lo que más se cambia, primero ----
      - name: horario
        label: Horario de atención
        description: "De aquí sale solo el letrero de Abierto / Cerrado que ve el cliente en la barra de arriba. Si el horario queda mal escrito, el letrero miente."
        type: object
        list: true
        fields:
          - { name: dias, label: Días, type: string }
          - { name: desde, label: "Abre (24h, ej. 08:00)", type: string }
          - { name: hasta, label: "Cierra (24h, ej. 17:30)", type: string }
          - name: nota
            label: Nota en vez de horario
            description: "Para un día especial. Si la llenas, sale esta nota y no las horas."
            type: string
      - name: formasDePago
        label: Formas de pago
        description: "Sale en la página del pedido y en la portada."
        type: text
      - name: domicilios
        label: Texto de domicilios
        description: "Sale en la portada y junto al total del pedido. No hay calculadora de domicilios: el valor se acuerda con la asesora, así que este texto es el que fija la expectativa."
        type: text
      - name: retiro
        label: Texto de retiro en la galería
        type: text
      - name: plazoDesde
        label: Plazo normal del taller — desde
        description: "Los días hábiles que tarda un mueble corriente, el mínimo. Vale para todos los muebles que no tengan su propio plazo cargado."
        type: number
      - name: plazoHasta
        label: Plazo normal del taller — hasta
        description: "El máximo del plazo normal. Con estos dos números el catálogo arma solo las frases de las fichas, la nota de arriba de las tarjetas y la cifra grande de la portada: no hay que escribirlas en ninguna parte ni acordarse de cambiarlas."
        type: number

      # ---- Textos de la portada ----
      - name: titular
        label: Titular de la página de inicio
        description: "La frase grande sobre la foto. Dos líneas como máximo en computador; si la haces muy larga, empuja los botones hacia abajo."
        type: string
      - name: presentacion
        label: Texto bajo el titular
        type: text
      - name: promesas
        label: Promesas de la barra superior
        description: "Las frases cortas de la cinta negra de arriba. Tres o cuatro como mucho: en celular se vuelven ilegibles si son más."
        type: string
        list: true
      - name: fraseMarca
        label: Frase de marca (franja del inicio)
        description: Una sola frase sobre el negocio. Sale centrada entre la portada y el catálogo. Si la dejas vacía, la franja desaparece.
        type: text
      - name: trayectoria
        label: Años en el mercado (línea bajo la frase)
        description: Va en mayúsculas debajo de la frase de marca. Déjalo vacío si no quieres que salga.
        type: string
      - name: avisoColores
        label: Aviso sobre los colores
        description: "Sale en la ficha de cada mueble, arriba del botón de pedir, y también en el catálogo y en la portada. Reemplazó a la paleta de colores: como con algunos colores y enchapes cambia el precio, una paleta fija prometía un precio que el taller no siempre puede sostener. Si lo dejas vacío, el aviso no sale."
        type: text
      - name: avisoWhatsapp
        label: Aviso bajo los botones de WhatsApp
        type: text
      - name: atajos
        label: Atajos de "Encuentra el tuyo"
        type: object
        list: true
        fields:
          - { name: titulo, label: Título del grupo, type: string }
          - name: icono
            label: Ícono del grupo
            description: Elige el dibujito que acompaña al título. Si creas un grupo nuevo y no eliges ninguno, sale una brújula.
            type: select
            options:
              values:
                - { value: espacio, label: Habitación (plano) }
                - { value: presupuesto, label: Presupuesto (tarjeta) }
                - { value: ocasion, label: Ocasión (regalo) }
                - { value: brujula, label: Brújula (genérico) }
          - name: opciones
            label: Opciones
            type: object
            list: true
            fields:
              - { name: texto, label: Texto, type: string }
              - { name: enlace, label: Enlace, type: string }

      # ---- Contacto y ubicación ----
      - name: telefonoWhatsapp
        label: WhatsApp de la línea principal
        description: "SOLO NÚMEROS, con indicativo y sin el signo + ni espacios: 573242117323. Si le pones + o espacios, TODOS los botones de WhatsApp del sitio dejan de funcionar y la página se sigue viendo bien, así que nadie se entera."
        type: string
        required: true
        pattern:
          regex: "^[0-9]{10,15}$"
          message: "Solo números, con indicativo y sin el signo + ni espacios. Ejemplo: 573242117323"
      - name: telefono
        label: Teléfono para mostrar
        description: "Este sí se escribe bonito, como lo lee el cliente: +57 324 211 7323. No se usa para los enlaces."
        type: string
      - { name: direccion, label: Dirección de la galería, type: string }
      - name: latitud
        label: Latitud de la galería
        description: Para el mapa. Si se mudan, abre Google Maps, haz clic derecho sobre el punto exacto y copia los dos números que aparecen. El primero va aquí.
        type: string
      - name: longitud
        label: Longitud de la galería
        description: El segundo de los dos números. Siempre empieza con signo menos en Colombia.
        type: string
      - name: redes
        label: Redes sociales
        type: object
        fields:
          - { name: instagram, label: Instagram, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: tiktok, label: TikTok, type: string }

      # ---- Fotos y marca ----
      - name: fotoPrincipal
        label: Foto principal del inicio
        description: La primera foto que ve quien entra, y la que aparece cuando alguien comparte el enlace del catálogo por WhatsApp. Súbela vertical, en proporción 3:4 (por ejemplo 1500 × 2000 px).
        type: image
      - name: fotoPrincipalAncha
        label: Foto principal para computador
        description: La misma escena pero horizontal, para la portada en pantalla ancha. Súbela apaisada, en proporción 16:9 (por ejemplo 2400 × 1350 px) y con el espacio libre hacia la izquierda, que es donde va el texto. Si la dejas vacía se usa la vertical.
        type: image
      - name: fotoPrincipalAlt
        label: Descripción de la foto principal
        description: Para quien no puede ver la foto y para los buscadores. Describe en una línea qué se ve.
        type: string
      - name: introMarca
        label: Presentación de marca al entrar
        description: "El letrero de Luz Mágica que se enciende a pantalla completa cuando alguien entra al inicio del catálogo. Dura tres segundos y se puede saltar tocando la pantalla. No se repite mientras la persona recorre el catálogo, y no sale cuando el cliente llega directo a un mueble por el enlace de un asesor. Para volver a verla, abre el inicio en una pestaña nueva. Desmárcalo para que el visitante entre directo siempre."
        type: boolean
        default: true
      - name: logoLetrero
        label: Logo de la presentación
        description: "El letrero que se enciende cuando alguien entra al inicio. Tiene que ser la versión con FONDO NEGRO y acostada: el negro del archivo se funde con el fondo de la pantalla y por eso el letrero se ve flotando. Si subes una con fondo blanco se va a ver un recuadro."
        type: image
      - name: introFondo
        label: Color del fondo de la presentación
        description: "Tiene que ser el mismo color del fondo del logo de arriba, o se nota el recuadro. Con el logo actual va #000000, que es negro."
        type: string
      - name: logo
        label: Logo (respaldo para compartir en WhatsApp)
        description: Solo se usa si no hay foto principal. Normalmente no hay que tocarlo.
        type: image
      - name: plazoCorto
        label: Texto bajo el precio en las tarjetas
        description: "No pongas días aquí. La tarjeta es igual para los 115 muebles y hay 21 que tardan más que el plazo normal: una cifra sola acá termina siendo una promesa que el taller no puede cumplir. Los días salen solos en la nota del catálogo y en la ficha de cada mueble."
        type: string

      # ---- Casi nunca se tocan ----
      - name: atribucion
        label: Comisiones de los asesores
        description: "Ajustes internos y delicados: de aquí depende de quién es la comisión. No los cambies sin hablarlo con el equipo. Lo único que ve el cliente es la nota del final."
        type: object
        fields:
          - name: regla
            label: ¿De quién es la comisión?
            description: "Hoy está en 'del primero'. Si un cliente abre el enlace de Ana y después el de Juan, la venta es de Ana. Cambiarlo a 'del último' le daría la venta a Juan, y eso cambia cómo cobra todo el equipo."
            type: select
            options:
              values:
                - { value: primero, label: Del primero que envió el enlace }
                - { value: ultimo, label: Del último enlace que abrió el cliente }
          - name: diasVigencia
            label: Días que dura la asignación
            description: "Cuántos días un cliente sigue siendo del asesor que lo trajo. Hoy son 90. Si lo bajas, los clientes quedan libres antes y pueden caerle a otro asesor."
            type: number
          - name: notaRegla
            label: Nota que ve el cliente en el inicio
            description: "Va en el recuadro 'Tu línea de atención' de la página de inicio. La lee un cliente, no un asesor: escribe qué gana él —que siempre le responde la misma persona—, no cómo se reparten las comisiones. El reparto es interno y se explica en la página del equipo."
            type: text
      - { name: nombre, label: Nombre del negocio, type: string }
      - { name: lema, label: Lema, type: string }
      - name: descripcionCorta
        label: Descripción para buscadores y WhatsApp
        description: "El texto que aparece bajo el título cuando alguien comparte el enlace del catálogo. Dos líneas."
        type: text
      - name: dominio
        label: Dirección del sitio
        description: "La dirección completa, con https. Se usa para armar los enlaces que se comparten. Si queda mal, las vistas previas de WhatsApp dejan de mostrar la foto."
        type: string
        pattern:
          regex: "^https://[^\\s/]+(/.*)?$"
          message: "Tiene que empezar por https:// y no llevar espacios."
